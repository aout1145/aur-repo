# Cloudflare Worker configuration for the repository proxy.
#
# Deploy with:
#   cd cloudflare && npx wrangler deploy
#
# After deploying, `wrangler` prints the URL, e.g.
#   https://aur-repo.<your-subdomain>.workers.dev
# Use that (or a custom domain, see below) as the pacman `Server`.

name = "aur-repo"
main = "worker.js"
compatibility_date = "2024-11-01"

# Expose the Worker on its workers.dev URL.  Set to false if you only use a
# custom domain.
workers_dev = false

[vars]
# The GitHub repository that hosts the release assets.
GITHUB_REPO = "aout1145/aur-repo"
# Must match `[repo].tag` in packages.toml.
RELEASE_TAG = "repo"
# Must match `[repo].name` + ".db" in packages.toml.  Only this database (and
# its .sig) is served; any other .db file is rejected.
DB_NAME = "aout.db"
# Title shown as the homepage heading (and in the browser tab).
TITLE = "aout's AUR Repository"

# Read by the deploy workflow, not by the Worker: whether a push touching
# cloudflare/ should automatically redeploy the Worker.  Set to false to only
# deploy manually (the deploy workflow is then skipped).
[deploy]
auto = true

# Optional: serve from a custom domain on a zone in your Cloudflare account
# instead of the workers.dev URL.

[[routes]]
pattern = "aur.aout.top"
custom_domain = true
