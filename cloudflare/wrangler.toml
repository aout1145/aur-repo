# Cloudflare Worker configuration for the repository proxy.
#
# Deploy with:
#   cd cloudflare && npx wrangler deploy
#
# After deploying, `wrangler` prints the URL, e.g.
#   https://aur-repo.<your-subdomain>.workers.dev
# Use that (or a custom domain, see below) as the pacman `Server`.

name = "aur-repo"
main = "worker.js"
compatibility_date = "2024-11-01"

# Expose the Worker on its workers.dev URL.  Set to false when only using a
# custom domain (see [[routes]] below).
workers_dev = false

# ---------------------------------------------------------------------------
# Worker environment variables (read by worker.js at runtime).
# ---------------------------------------------------------------------------
[vars]
# GitHub repository that hosts the release assets.
GITHUB_REPO = "aout1145/aur-repo"

# Must match `[repo].tag` in packages.toml.
RELEASE_TAG = "repo"

# Must match `[repo].name` + ".db" in packages.toml.  Only this database (and
# its .sig) is served; any other .db file is rejected.
DB_NAME = "aout.db"

# Homepage heading (also the browser tab title).
TITLE = "aout's AUR Repository"

# ---------------------------------------------------------------------------
# Read by the CI scripts, not by the Worker.
# ---------------------------------------------------------------------------
[deploy]
# Whether a push touching cloudflare/ automatically redeploys the Worker
# (deploy-worker.yml).  Set to false to only deploy manually.
auto = true

# Whether publish.py purges replaced/removed package files from the Cloudflare
# cache by Cache-Tag.  Requires the CLOUDFLARE_ZONE_ID secret and a token with
# "Zone -> Cache Purge -> Purge".
purge = true

# ---------------------------------------------------------------------------
# Optional custom domain (instead of the workers.dev URL).
# ---------------------------------------------------------------------------
[[routes]]
pattern = "aur.aout.top"
custom_domain = true
