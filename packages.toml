# ---------------------------------------------------------------------------
# AUR package list for the automatic repository builder.
#
# Only packages listed in `packages` are treated as "targets".  Their AUR
# dependencies (including dependencies that live only in the AUR) are resolved
# recursively and built in the correct order.  Every package in the resolved
# graph is published, so the repository stays self-contained.
#
# This is a TOML file, read with Python's built-in `tomllib` (no extra
# dependencies).
#
# NOTE: `packages` is a top-level key, so it must appear before the first
# `[table]` header below.
# ---------------------------------------------------------------------------

# The AUR packages (package names or pkgbase names) to build and keep up to
# date in the repository.
packages = [
  "cpeditor",
  "cpeditor-bin",
  "bibata-cursor-theme",
  "github-desktop",
  "gnome-rounded-blur",
  "gnome-shell-extension-arch-update",
  "gnome-shell-extension-bing-wallpaper",
  "gnome-shell-extension-blur-my-shell",
  "moekoemusic-bin",
  "motrix-next-bin",
  "visual-studio-code-bin",
]

[repo]
# Base name of the pacman database.  With `name = "custom"` clients add a
# `[custom]` section to pacman.conf and the file published to storage is
# `custom.db`.
name = "aout"

# The GitHub release tag that holds the repository.  All packages and the
# database are uploaded as assets of this single release.
tag = "repo"

# Architecture to build for.  GitHub's runners are x86_64.
arch = "x86_64"

# Remove stale package assets from the release: older versions of rebuilt
# packages, and packages removed from this list.  Off by default.
remove_old = false

[build]
# Run the PKGBUILD `check()` function.  Enabling this also pulls in AUR
# `checkdepends`, so leave it off unless you really want to run test suites.
run_checks = false

# Rebuild a package when one of its AUR dependencies was rebuilt in the same
# run (useful for shared libraries).  Off by default so that scheduled runs
# never rebuild more than necessary.
rebuild_dependents = false

# Rebuild VCS packages (source URLs like `git+https://...`) on every run.
# VCS versions cannot be compared against the published version, so they are
# only rebuilt when this is enabled or when a run is forced.  Prefer enabling
# this per package via `[overrides.<name>]` or the `update_vcs` workflow input.
update_vcs = false

# ---------------------------------------------------------------------------
# Optional per-package overrides.  The key is the package (base) name exactly
# as it appears in `packages`.
# ---------------------------------------------------------------------------
# [overrides.some-daemon-git]
# vcs = true          # override VCS auto-detection (bool)
# update_vcs = true   # always rebuild this VCS package (bool)
# skip_check = true   # never run check() for this package (bool)
#
# [overrides.spotify]
# skip_check = true
