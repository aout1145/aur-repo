# ---------------------------------------------------------------------------
# AUR package list for the automatic repository builder.
#
# Only the packages in `packages` are "targets".  Their AUR dependencies
# (including dependencies that exist only in the AUR) are resolved recursively,
# built in dependency order and published too, so the repository is
# self-contained.
#
# This is a TOML file, read with Python's built-in `tomllib` (no extra
# dependencies).
#
# NOTE: `packages` is a top-level key, so it must appear before the first
# `[table]` header below.
# ---------------------------------------------------------------------------

# AUR package names (or pkgbase names) to build and keep up to date.
packages = [
  "cpeditor",
  "cpeditor-bin",
  "bibata-cursor-theme",
  "gnome-rounded-blur",
  "gnome-shell-extension-arch-update",
  "gnome-shell-extension-bing-wallpaper",
  "gnome-shell-extension-blur-my-shell",
  "moekoemusic-bin",
  "motrix-next-bin",
  "visual-studio-code-bin",
]

# ---------------------------------------------------------------------------
# Repository settings.
# ---------------------------------------------------------------------------
[repo]
# Base name of the pacman database: `aout` -> `aout.db`, and clients add a
# `[aout]` section to pacman.conf.
name = "aout"

# GitHub release tag that holds the repository; all packages and the database
# live in this single release.
tag = "repo"

# Architecture to build for (GitHub's runners are x86_64).
arch = "x86_64"

# Delete stale package assets from the release (older versions of rebuilt
# packages and packages removed from `packages`).  Default: false.
remove_old = true

# ---------------------------------------------------------------------------
# Build options (defaults shown in the comments).
# ---------------------------------------------------------------------------
[build]
# Run the PKGBUILD `check()` function.  This also pulls in AUR `checkdepends`,
# so leave it off unless you really want to run test suites.
run_checks = false

# Rebuild a package when one of its AUR dependencies was rebuilt in the same
# run (useful for shared libraries).  Off by default so scheduled runs never
# rebuild more than necessary.
rebuild_dependents = false

# Rebuild VCS packages (PKGBUILDs with a `pkgver()` function, e.g. `…-git`) on
# every run.  Their version cannot be compared with the published one, so they
# are only rebuilt when this is enabled or the run is forced.  Can also be
# enabled per package below.
update_vcs = true

# Skip source PGP verification while building.
# skip_pgp_check = false

# ---------------------------------------------------------------------------
# Optional per-package overrides.  The key must exactly match a name in
# `packages`.
# ---------------------------------------------------------------------------
# [overrides.some-daemon-git]
# vcs = true          # force VCS handling (bool)
# update_vcs = true   # rebuild this VCS package on every run (bool)
# skip_check = true   # never run check() for this package (bool)
